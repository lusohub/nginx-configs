server {
    listen 80;
    listen 443 ssl;

    # Self-signed certs
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    server_name _;

    location / {
        default_type text/plain;
        return 200 "OK, hello world\n";
    }
}